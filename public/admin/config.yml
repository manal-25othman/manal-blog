# إعدادات محرّر إسناد. المحتوى يبقى ملفات Markdown في المستودع،
# وكل حفظ من المحرّر يصبح كوميت في GitHub — بلا قاعدة بيانات ولا خادم إدارة.

# التحرير المحلي: افتح /admin على خادم التطوير واختر «العمل على مستودع محلي»،
# فيحرّر المحرّر الملفات على قرصك مباشرةً بلا استيثاق ولا إنترنت.
# يتطلب متصفّحًا يدعم File System Access API (Chrome أو Edge).
local_backend: true

backend:
  name: github
  repo: manal-25othman/manal-blog
  branch: main
  # نقطة الاستيثاق مبنيّة داخل الموقع نفسه (src/app/api/oauth) — لا وسيط خارجي.
  # ⚠ هذه القيمة يجب أن تساوي نطاق الموقع المنشور بالضبط.
  #   غيّريها هنا عند ربط النطاق الخاص، وإلّا أعاد GitHub التوجيه إلى عنوان خاطئ.
  base_url: https://manal-blog.vercel.app
  auth_endpoint: api/oauth/github

# مسودّات وتحرير قبل النشر عبر طلبات دمج على GitHub
publish_mode: editorial_workflow

locale: ar
media_folder: public/uploads
public_folder: /uploads

collections:
  # ─── التصنيفات ────────────────────────────────────────────────
  # إضافة تصنيف هنا تنشئ صفحته وتضيفه إلى قائمة تصنيف المقال تلقائيًّا.
  - name: categories
    label: التصنيفات
    label_singular: تصنيف
    folder: content/categories
    create: true
    slug: "{{fields.slug}}"
    preview_path: categories/{{slug}}
    summary: "{{name}} — {{slug}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: اسم التصنيف, widget: string, hint: "كما يظهر للقارئ" }
      - { name: short, label: الاسم المختصر, widget: string, hint: "كلمة أو كلمتان — يظهر في البطاقات الضيّقة" }
      - {
          name: slug,
          label: معرّف التصنيف,
          widget: string,
          pattern: ["^[a-z0-9-]+$", "حروف لاتينية صغيرة وأرقام وشرطات فقط"],
          hint: "يصير رابط /categories/<المعرّف>. لا تغيّريه بعد نشر مقالات فيه",
        }
      - {
          name: accent,
          label: لون التصنيف,
          widget: string,
          pattern: ["^#[0-9a-fA-F]{6}$", "لون ست عشري من ستّة محارف، مثل #2AB7C4"],
          hint: "يميّز أغلفة مقالات التصنيف",
        }
      - { name: order, label: ترتيب العرض, widget: number, value_type: int, hint: "الأصغر أوّلًا — اترك فجوات ١٠، ٢٠، ٣٠ ليسهل الإدراج" }
      - { name: subtopics, label: المواضيع الفرعية, widget: list, default: [], hint: "تظهر في صفحة التصنيف كخريطة للمجال" }
      - { name: body, label: وصف التصنيف, widget: text, hint: "فقرة تشرح ما يغطّيه التصنيف" }

  - name: articles
    label: المقالات
    label_singular: مقال
    folder: content/articles
    create: true
    slug: "{{fields.slug}}"
    preview_path: articles/{{slug}}
    summary: "{{title}} — {{published}}"
    sortable_fields: [published, title, category]
    fields:
      - { name: title, label: العنوان, widget: string, hint: "٥٠–٦٠ حرفًا، والكلمة المفتاحية في أوله" }
      - { name: seoTitle, label: عنوان السيو (اختياري), widget: string, required: false }
      - {
          name: description,
          label: الوصف,
          widget: text,
          pattern: ['^.{80,200}$', 'المطلوب بين ٨٠ و٢٠٠ حرف'],
          hint: "يظهر في نتائج البحث وبطاقة المقال",
        }
      # القائمة تُقرأ من مجموعة «التصنيفات» مباشرةً، فالتصنيف الجديد يظهر
      # هنا فورًا بلا تعديل هذا الملف.
      - {
          name: category,
          label: التصنيف,
          widget: relation,
          collection: categories,
          value_field: slug,
          search_fields: [name, slug],
          display_fields: [name],
        }
      - { name: tags, label: الوسوم, widget: list, default: [], hint: "٣–٦ وسوم" }
      - { name: published, label: تاريخ النشر, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - {
          name: status,
          label: حالة النشر,
          widget: select,
          required: false,
          default: "",
          options:
            [
              { label: "منشور (حسب التاريخ)", value: "" },
              { label: "مجدوَل — لا يظهر قبل تاريخه", value: scheduled },
              { label: "مسوّدة — لا يظهر إطلاقًا", value: draft },
            ],
          hint: "تاريخ مستقبلي بلا «مجدوَل» يُرفض في فحص المحتوى. القارئ لا يرى تاريخًا لم يأتِ بعد.",
        }
      - { name: updated, label: تاريخ التحديث, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, required: false }
      - { name: featured, label: مقال ركيزة, widget: boolean, default: false }
      - {
          name: takeaways,
          label: الخلاصة قبل القراءة,
          widget: list,
          min: 3,
          hint: "ثلاث نقاط على الأقل — تظهر في صندوق أعلى المقال",
        }
      - {
          name: body,
          label: المتن,
          widget: markdown,
          hint: "إلزامي: قسم «## الأسئلة الشائعة» وقسم «## المراجع»، وقسم يحدّد حدود الحلّ",
        }

  - name: tool-categories
    label: تصنيفات الأدوات
    label_singular: قسم
    folder: content/tool-categories
    create: true
    slug: "{{fields.slug}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: اسم القسم, widget: string }
      - {
          name: slug,
          label: المعرّف اللاتيني,
          widget: string,
          pattern: ["^[a-z0-9-]+$", "حروف إنجليزية صغيرة وأرقام وشرطات فقط. مثال «أدوات التصميم» ← design-tools"],
          hint: "لا تغيّريه بعد إسناد أدوات إليه",
        }
      - { name: order, label: ترتيب العرض, widget: number, value_type: int, hint: "الأصغر أوّلًا" }
      - { name: body, label: وصف القسم, widget: text, hint: "سطر يشرح ما يجمعه القسم" }

  - name: tools
    label: الأدوات
    label_singular: أداة
    folder: content/tools
    create: true
    slug: "{{fields.slug}}"
    preview_path: tools/{{slug}}
    summary: "{{name}} — {{category}}"
    sortable_fields: [name, category, published]
    fields:
      - { name: name, label: الاسم بالعربية, widget: string }
      - { name: nameLatin, label: الاسم كما يكتبه المنتج, widget: string }
      - {
          name: slug,
          label: المعرّف اللاتيني (عنوان الصفحة),
          widget: string,
          pattern: ["^[a-z0-9-]+$", "حروف إنجليزية صغيرة وأرقام وشرطات فقط — بلا مسافات وبلا حروف كبيرة. مثال «Note Book LM» ← notebooklm"],
          hint: "تصير الصفحة /tools/<المعرّف>. لا تغيّريه بعد النشر",
        }
      - { name: description, label: الوصف, widget: text, hint: "سطر واحد: ما تفعله الأداة، لا لماذا هي رائعة" }
      # القائمة تُقرأ من مجموعة «تصنيفات الأدوات» مباشرةً.
      - {
          name: category,
          label: التصنيف,
          widget: relation,
          collection: tool-categories,
          value_field: slug,
          search_fields: [name, slug],
          display_fields: [name],
        }
      - { name: formerName, label: الاسم السابق, widget: string, required: false, hint: "إن غيّرت الأداة اسمها — يظهر تحت الاسم ويُبحث به" }
      - { name: kind, label: التصنيف الدقيق, widget: string, required: false, hint: "مثل «مولّد برومبتات» أو «قاعدة متّجهات»" }
      - {
          name: availability,
          label: الإتاحة,
          widget: select,
          options:
            [
              { label: "مجانية", value: free },
              { label: "مجانية محدودة", value: limited-free },
              { label: "مدفوعة", value: paid },
              { label: "حسب الاستخدام", value: usage-based },
            ],
          hint: "لا تكتبي سعرًا — السعر يتغيّر أسرع من تحديث الصفحة",
        }
      - { name: useCases, label: أبرز الاستخدامات, widget: list, default: [], hint: "ثلاثة إلى خمسة استخدامات ملموسة" }
      - { name: audience, label: لمن تناسب, widget: list, default: [] }
      - { name: strength, label: أبرز نقطة قوّة, widget: text, required: false }
      - { name: caveat, label: أبرز قيد أو ملاحظة, widget: text, required: false }
      - { name: keywords, label: كلمات البحث, widget: list, default: [], hint: "الاسم السابق والنطق العربي والمرادفات" }
      - {
          name: license,
          label: حالة المصدر,
          widget: select,
          options:
            [
              { label: "مفتوح المصدر", value: open-source },
              { label: "مفتوح جزئيًّا", value: partially-open },
              { label: "مغلق المصدر", value: proprietary },
            ],
          hint: "مفتوح الأوزان ليس مفتوح المصدر — لا تكتبي «مفتوح المصدر» إلا بترخيص معلن",
        }
      - {
          name: hosting,
          label: طريقة التشغيل,
          widget: select,
          options:
            [
              { label: "استضافة ذاتية", value: self-hosted },
              { label: "خدمة مُدارة", value: managed },
              { label: "ذاتية أو مُدارة", value: both },
            ],
        }
      - { name: website, label: الموقع الرسمي, widget: string, pattern: ["^https://", "رابط https حقيقي — لا يُدرج مدخل بلا مصدر رسمي"] }
      - {
          name: logo,
          label: صورة الأداة,
          widget: image,
          required: false,
          hint: "شعار الأداة أو لقطة من واجهتها. مربّعة أفضل، و٢٥٦ بكسل تكفي. المدخل بلا صورة يعرض حرف الأداة الأول بدلًا منها",
        }
      - {
          name: logoAlt,
          label: وصف الصورة (بديل نصّي),
          widget: string,
          required: false,
          hint: "لقارئ الشاشة. يُترك فارغًا فيُكتب «شعار <اسم الأداة>» تلقائيًّا",
        }
      - { name: docs, label: التوثيق, widget: string, required: false }
      - { name: repo, label: المستودع, widget: string, required: false }
      - {
          name: tiktok,
          label: رابط مقطع تيك توك,
          widget: string,
          required: false,
          hint: "اتركه فارغًا ما لم يوجد مقطع فعلي. الشارة لا تظهر إلا برابط.",
        }
      - { name: goodFor, label: متى تناسبك, widget: list, default: [] }
      - { name: limits, label: متى لا تناسبك, widget: list, default: [], hint: "مطلوب — المدخل بلا حدود إعلان لا مراجعة" }
      - {
          name: order,
          label: ترتيب العرض,
          widget: number,
          value_type: int,
          required: false,
          hint: "الأصغر أوّلًا. فارغًا = ٥٠٠. لإبرازها اكتبي ١٠ أو ٢٠، ولتأخيرها ٩٠٠",
        }
      - {
          name: hidden,
          label: إخفاء من الموقع,
          widget: boolean,
          default: false,
          hint: "تختفي من الدليل والبحث وجوجل، ويبقى المدخل محفوظًا لتعيديه متى شئتِ",
        }
      - { name: relatedArticles, label: مقالات مرتبطة (المسارات), widget: list, default: [], required: false }
      - { name: published, label: تاريخ النشر, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { name: updated, label: تاريخ التحديث, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, required: false }
      - { name: body, label: المتن, widget: markdown }

  - name: pages
    label: الصفحات
    label_singular: صفحة
    folder: content/pages
    create: false
    delete: false
    preview_path: "{{slug}}"
    fields:
      - { name: title, label: العنوان, widget: string }
      - { name: description, label: وصف السيو, widget: text }
      - { name: lead, label: السطر الافتتاحي, widget: text, required: false }
      - { name: updated, label: آخر تحديث, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, required: false }
      - { name: body, label: المتن, widget: markdown }
