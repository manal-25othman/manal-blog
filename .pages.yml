# إعدادات محرّر Pages CMS (app.pagescms.org)
# محرّر مستضاف يقرأ هذا الملف من جذر المستودع: تدخل بحساب GitHub، تختار
# المستودع، فيعرض المحتوى بالحقول أدناه. كل حفظ كوميت، وكل كوميت بناء.
# المسارات نسبية إلى جذر المستودع.

media:
  input: public/uploads
  output: /uploads

content:
  # ─── التصنيفات ────────────────────────────────────────────────
  # مصدر تصنيفات الموقع. إضافة ملف هنا تضيف تصنيفًا كاملًا: صفحة خاصة به،
  # ومدخلًا في قوائم التصنيف، وخيارًا في حقل تصنيف المقال.
  - name: categories
    label: التصنيفات
    description: >-
      تصنيفات المقالات. اسم الملف هو معرّف التصنيف، وهو ما يُكتب في ترويسة
      كل مقال — لا تغيّريه بعد نشر مقالات فيه، وإلّا فقدت المقالات تصنيفها.
    type: collection
    path: content/categories
    format: yaml-frontmatter
    filename: '{fields.slug}.md'
    view:
      fields: [name, slug, order]
      primary: name
      sort: [order, name]
    fields:
      - name: name
        label: اسم التصنيف
        type: string
        required: true
        description: كما يظهر للقارئ. مثال «الاسترجاع المعزّز (RAG)».

      - name: short
        label: الاسم المختصر
        type: string
        required: true
        description: يظهر في البطاقات الضيّقة وشارات المقالات. كلمة أو كلمتان.

      - name: slug
        label: معرّف التصنيف
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9-]+$'
          message: حروف لاتينية صغيرة وأرقام وشرطات فقط — هذا هو عنوان صفحة التصنيف.
        description: >-
          يصير رابط الصفحة /categories/<المعرّف>. لا تغيّريه بعد نشر مقالات
          في التصنيف: المقالات تشير إليه بالاسم.

      - name: accent
        label: لون التصنيف
        type: string
        required: true
        pattern:
          regex: '^#[0-9a-fA-F]{6}$'
          message: 'لون ست عشري من ستّة محارف، مثل #2AB7C4'
        description: يميّز أغلفة مقالات التصنيف. اللون غير الصالح يُستبدل بمحايد.

      - name: order
        label: ترتيب العرض
        type: number
        required: true
        description: الأصغر أوّلًا. اترك فجوات (١٠، ٢٠، ٣٠…) ليسهل الإدراج بينها.

      - name: subtopics
        label: المواضيع الفرعية
        type: string
        list: true
        description: تظهر في صفحة التصنيف كخريطة للمجال.

      - name: body
        label: وصف التصنيف
        type: text
        description: فقرة تشرح ما يغطّيه التصنيف. تظهر أعلى صفحته وفي نتائج البحث.

  # ─── المقالات ─────────────────────────────────────────────────
  - name: articles
    label: المقالات
    description: مقالات إسناد التقنية. كل مقال ملف Markdown في المستودع.
    type: collection
    path: content/articles
    format: yaml-frontmatter
    # اسم الملف هو رابط المقال، ولذلك يُبنى من حقل slug اللاتيني لا من العنوان العربي.
    filename: '{fields.slug}.md'
    view:
      fields: [title, category, published, featured]
      primary: title
      sort: [published, title]
    fields:
      - name: title
        label: العنوان
        type: string
        required: true
        description: ٥٠–٦٠ حرفًا، والكلمة المفتاحية في أوله.

      - name: slug
        label: المعرّف اللاتيني (عنوان الصفحة)
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9-]+$'
          message: >-
            حروف إنجليزية صغيرة وأرقام وشرطات فقط — بلا مسافات وبلا حروف كبيرة
            وبلا عربية. مثال «دليل RAG الكامل» ← rag-complete-guide
        description: >-
          بحروف إنجليزية صغيرة تفصلها شرطات. تصير الصفحة /articles/<المعرّف>.
          لا تغيّريه بعد النشر: الرابط المنشور ينكسر وتضيع أرشفته في جوجل.

      - name: seoTitle
        label: عنوان السيو
        type: string
        required: false
        description: يُستعمل في نتائج البحث إن اختلف عن العنوان الظاهر.

      - name: description
        label: الوصف
        type: text
        required: true
        options:
          minlength: 80
          maxlength: 200
        description: وعد + فائدة. يظهر في نتائج البحث وبطاقة المقال.

      - name: category
        label: التصنيف
        type: reference
        required: true
        options:
          collection: categories
          value: '{fields.slug}'
          label: '{fields.name}'
          search: [name, slug]
        description: >-
          القائمة تُقرأ من «التصنيفات» مباشرةً، فالتصنيف الذي تضيفينه هناك
          يظهر هنا فورًا بلا تعديل إعدادات.

      - name: tags
        label: الوسوم
        type: string
        list: true
        description: ٣–٦ وسوم.

      - name: published
        label: تاريخ النشر
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: updated
        label: تاريخ آخر تحديث
        type: date
        required: false
        options:
          format: yyyy-MM-dd

      - name: status
        label: حالة النشر
        type: select
        required: false
        options:
          values:
            - { value: '', label: 'منشور (حسب التاريخ)' }
            - { value: 'scheduled', label: 'مجدوَل — لا يظهر قبل تاريخه' }
            - { value: 'draft', label: 'مسوّدة — لا يظهر إطلاقًا' }
        description: >-
          تاريخ مستقبلي بلا «مجدوَل» يُرفض في فحص المحتوى. القارئ لا يرى تاريخًا
          لم يأتِ بعد.

      - name: featured
        label: مقال ركيزة
        type: boolean
        default: false
        description: يظهر متصدّرًا في الرئيسية وأرشيف المقالات.

      - name: takeaways
        label: الخلاصة قبل القراءة
        type: text
        list:
          min: 3
        description: ثلاث نقاط على الأقل — تظهر في صندوق أعلى المقال.

      - name: body
        label: المتن
        type: rich-text
        description: >-
          إلزامي: قسم «## الأسئلة الشائعة» وقسم «## المراجع»، وقسم يحدّد حدود
          الحلّ («متى لا يصلح…»). راجع docs/EDITOR.md.

  # ─── تصنيفات الأدوات ──────────────────────────────────────────
  # أقسام دليل الأدوات. إضافة ملف هنا تضيف قسمًا جديدًا وخيارًا في حقل
  # تصنيف الأداة. الدليل موجّه لأدوات بناء أنظمة الذكاء الاصطناعي، فأضيفي
  # قسمًا فقط حين يكون له أكثر من أداة واحدة تنتمي إليه.
  - name: tool-categories
    label: تصنيفات الأدوات
    type: collection
    path: content/tool-categories
    format: yaml-frontmatter
    filename: '{fields.slug}.md'
    view:
      fields: [name, slug, order]
      primary: name
      sort: [order, name]
    fields:
      - name: name
        label: اسم القسم
        type: string
        required: true

      - name: slug
        label: المعرّف اللاتيني
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9-]+$'
          message: >-
            حروف إنجليزية صغيرة وأرقام وشرطات فقط. مثال «أدوات التصميم» ←
            design-tools
        description: لا تغيّريه بعد إسناد أدوات إليه — الأدوات تشير إليه بالاسم.

      - name: order
        label: ترتيب العرض
        type: number
        required: true
        description: الأصغر أوّلًا. اترك فجوات (١٠، ٢٠، ٣٠…).

      - name: body
        label: وصف القسم
        type: text
        description: سطر يشرح ما يجمعه القسم. يظهر تحت اسمه في مرشّحات الدليل.

  # ─── الأدوات ──────────────────────────────────────────────────
  - name: tools
    label: الأدوات
    description: >-
      دليل أدوات بناء أنظمة الذكاء الاصطناعي. كل مدخل يذكر حدود الأداة لا
      مزاياها فقط، ولا يُدرج مدخل بلا رابط رسمي.
    type: collection
    path: content/tools
    format: yaml-frontmatter
    filename: '{fields.slug}.md'
    view:
      fields: [name, category, license, published]
      primary: name
      sort: [name, published]
    fields:
      - name: name
        label: الاسم بالعربية
        type: string
        required: true

      - name: nameLatin
        label: الاسم كما يكتبه المنتج
        type: string
        required: true

      - name: slug
        label: المعرّف اللاتيني (عنوان الصفحة)
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9-]+$'
          message: >-
            حروف إنجليزية صغيرة وأرقام وشرطات فقط — بلا مسافات وبلا حروف كبيرة
            وبلا عربية. مثال «Note Book LM» ← notebooklm
        description: >-
          بحروف إنجليزية صغيرة بلا مسافات — هذا هو عنوان الصفحة. مثال: «Note Book LM» ← notebooklm تصير الصفحة /tools/<المعرّف>. لا تغيّريه بعد النشر: الرابط
          المنشور ينكسر.

      - name: description
        label: الوصف
        type: text
        required: true
        description: سطر واحد يقول ما تفعله الأداة، لا لماذا هي رائعة.

      - name: category
        label: التصنيف
        type: reference
        required: true
        options:
          collection: tool-categories
          value: '{fields.slug}'
          label: '{fields.name}'
          search: [name, slug]
        description: >-
          القائمة تُقرأ من «تصنيفات الأدوات» مباشرةً، فالتصنيف الذي تضيفينه
          هناك يظهر هنا فورًا.

      - name: formerName
        label: الاسم السابق
        type: string
        required: false
        description: إن غيّرت الأداة اسمها. يظهر تحت الاسم ويُبحث به.

      - name: kind
        label: التصنيف الدقيق
        type: string
        required: false
        description: وصف قصير للنوع، مثل «مولّد برومبتات» أو «قاعدة متّجهات».

      - name: availability
        label: الإتاحة
        type: select
        required: true
        options:
          values:
            - { value: free, label: مجانية }
            - { value: limited-free, label: مجانية محدودة }
            - { value: paid, label: مدفوعة }
            - { value: usage-based, label: حسب الاستخدام }
        description: >-
          أربع حالات لا أرقام. لا تكتبي سعرًا: السعر يتغيّر أسرع من تحديث
          الصفحة، فيصير الدليل قديمًا خلال أسابيع.

      - name: useCases
        label: أبرز الاستخدامات
        type: text
        list: true
        description: ثلاثة إلى خمسة استخدامات ملموسة.

      - name: audience
        label: لمن تناسب
        type: string
        list: true

      - name: strength
        label: أبرز نقطة قوّة
        type: text
        required: false

      - name: caveat
        label: أبرز قيد أو ملاحظة
        type: text
        required: false

      - name: keywords
        label: كلمات البحث
        type: string
        list: true
        description: >-
          كلمات يبحث بها القارئ ولا ترد في الاسم أو الوصف: الاسم السابق،
          والنطق العربي للاسم اللاتيني، والمرادفات.

      - name: license
        label: حالة المصدر
        type: select
        required: true
        options:
          values:
            - { value: open-source, label: مفتوح المصدر }
            - { value: partially-open, label: مفتوح جزئيًّا }
            - { value: proprietary, label: مغلق المصدر }
        description: >-
          «مفتوح جزئيًّا» لما تُتاح أوزان نموذجه دون شيفرة منصّته. لا تكتبي
          «مفتوح المصدر» إلا بترخيص معلن — مفتوح الأوزان ليس مفتوح المصدر.

      - name: hosting
        label: طريقة التشغيل
        type: select
        required: true
        options:
          values:
            - { value: self-hosted, label: استضافة ذاتية }
            - { value: managed, label: خدمة مُدارة }
            - { value: both, label: ذاتية أو مُدارة }

      - name: website
        label: الموقع الرسمي
        type: string
        required: true
        pattern:
          regex: '^https://'
          message: رابط https حقيقي — لا يُدرج مدخل بلا مصدر رسمي.

      - name: logo
        label: صورة الأداة
        type: image
        required: false
        description: >-
          شعار الأداة أو لقطة من واجهتها. ارفعيها من هنا فتُخزَّن داخل الموقع.
          مربّعة أفضل، وحوالي ٢٥٦ بكسل تكفي. المدخل بلا صورة يعرض حرف الأداة
          الأول بدلًا منها، فلا تختلّ الشبكة.

      - name: logoAlt
        label: وصف الصورة (بديل نصّي)
        type: string
        required: false
        description: لقارئ الشاشة. يُترك فارغًا فيُكتب «شعار <اسم الأداة>» تلقائيًّا.

      - name: docs
        label: التوثيق
        type: string
        required: false

      - name: repo
        label: المستودع
        type: string
        required: false

      - name: tiktok
        label: رابط مقطع تيك توك
        type: string
        required: false
        description: >-
          اتركه فارغًا ما لم يوجد مقطع فعلي. شارة «غطّيتها في تيك توك» لا تظهر
          إلا برابط حقيقي.

      - name: goodFor
        label: متى تناسبك
        type: text
        list:
          min: 1

      - name: limits
        label: متى لا تناسبك
        type: text
        list:
          min: 1
        description: مطلوب — المدخل بلا حدود إعلان لا مراجعة.

      - name: relatedArticles
        label: مقالات مرتبطة (المسارات)
        type: string
        list: true
        required: false

      - name: published
        label: تاريخ النشر
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: updated
        label: تاريخ آخر تحديث
        type: date
        required: false
        options:
          format: yyyy-MM-dd

      - name: body
        label: المتن
        type: rich-text

  # ─── الصفحات ──────────────────────────────────────────────────
  # كل صفحة ملف مستقل لأن مسارها مرتبط بالكود: لا تُنشأ صفحات جديدة من هنا.
  - name: pages
    label: الصفحات
    type: group
    items:
      - { name: page_about, label: عن إسناد, type: file, path: content/pages/about.md, format: yaml-frontmatter, fields: &page_fields [
            { name: title, label: العنوان, type: string, required: true },
            { name: description, label: وصف السيو, type: text, required: true },
            { name: lead, label: السطر الافتتاحي, type: text, required: false },
            { name: updated, label: آخر تحديث, type: date, required: false, options: { format: yyyy-MM-dd } },
            { name: body, label: المتن, type: rich-text },
          ] }
      - { name: page_contact, label: تواصل معنا, type: file, path: content/pages/contact.md, format: yaml-frontmatter, fields: *page_fields }
      - { name: page_privacy, label: سياسة الخصوصية, type: file, path: content/pages/privacy-policy.md, format: yaml-frontmatter, fields: *page_fields }
      - { name: page_cookies, label: سياسة الكوكيز, type: file, path: content/pages/cookie-policy.md, format: yaml-frontmatter, fields: *page_fields }
      - { name: page_terms, label: شروط الاستخدام, type: file, path: content/pages/terms.md, format: yaml-frontmatter, fields: *page_fields }
      - { name: page_disclaimer, label: إخلاء المسؤولية, type: file, path: content/pages/disclaimer.md, format: yaml-frontmatter, fields: *page_fields }
      - { name: page_editorial, label: سياسة التحرير, type: file, path: content/pages/editorial-policy.md, format: yaml-frontmatter, fields: *page_fields }
      - { name: page_advertising, label: سياسة الإعلانات, type: file, path: content/pages/advertising-policy.md, format: yaml-frontmatter, fields: *page_fields }
